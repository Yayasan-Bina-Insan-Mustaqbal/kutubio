<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 210" width="100%" height="100%" style="border-radius: 8px;">
  <!-- Background luar -->
  <rect width="160" height="210" fill="#F4F6F9" />

  <!-- Kartu border dalam -->
  <rect x="11" y="11" width="138" height="188" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Tiga garis horizontal sebagai representasi tulisan (slate grey #8B9BB4) -->
  <rect x="41" y="55" width="78" height="7.5" rx="3.75" fill="#8B9BB4" />
  <rect x="41" y="73" width="78" height="7.5" rx="3.75" fill="#8B9BB4" />
  <rect x="41" y="91" width="54" height="7.5" rx="3.75" fill="#8B9BB4" />

  <!-- Background ikon panah (rounded square biru-abu sangat muda) -->
  <rect x="59" y="117" width="42" height="42" rx="8" fill="#EBF1F6" />

  <!-- Ikon panah (slate grey #8B9BB4, ujung membulat round cap, bold) -->
  <g stroke="#8B9BB4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Garis vertikal -->
    <path d="M80 152 V124" />
    <!-- Sayap panah -->
    <path d="M66 138 L80 124 L94 138" />
  </g>

  <!-- Teks "COVER BELUM TERSEDIA" -->
  <text x="80" y="179" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#374151" text-anchor="middle" letter-spacing="0.3">
    COVER BELUM TERSEDIA
  </text>
</svg>