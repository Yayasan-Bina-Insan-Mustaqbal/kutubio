services:
  app:
    build:
      context: .
      dockerfile: ./docker/sail/8.5/Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: kutubio-app-prod
    container_name: kutubio-app
    restart: unless-stopped
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: 'off'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: kutubio
      DB_USERNAME: kutubio
      DB_PASSWORD: password
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    networks:
      - sail
    depends_on:
      - pgsql
      - redis

  web:
    image: nginx:alpine
    container_name: kutubio-web
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sail
    depends_on:
      - app

  horizon:
    image: kutubio-app-prod
    container_name: kutubio-horizon
    restart: unless-stopped
    command: php artisan horizon
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: kutubio
      DB_USERNAME: kutubio
      DB_PASSWORD: password
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    networks:
      - sail
    depends_on:
      - app
      - redis

  scheduler:
    image: kutubio-app-prod
    container_name: kutubio-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: kutubio
      DB_USERNAME: kutubio
      DB_PASSWORD: password
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    networks:
      - sail
    depends_on:
      - app

  pgsql:
    image: 'postgres:18-alpine'
    container_name: kutubio-pgsql
    restart: unless-stopped
    ports:
        - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
        POSTGRES_DB: kutubio
        POSTGRES_USER: kutubio
        POSTGRES_PASSWORD: password
    volumes:
        - 'sail-pgsql:/var/lib/postgresql'
    networks:
        - sail
    healthcheck:
        test: ["CMD", "pg_isready", "-q", "-d", "kutubio", "-U", "kutubio"]
        retries: 3
        timeout: 5s

  redis:
    image: 'redis:alpine'
    container_name: kutubio-redis
    restart: unless-stopped
    ports:
        - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
        - 'sail-redis:/data'
    networks:
        - sail
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        retries: 3
        timeout: 5s

  searxng:
    image: searxng/searxng:latest
    container_name: kutubio-searxng
    restart: unless-stopped
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - sail
    depends_on:
      redis:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: kutubio-gotenberg
    restart: unless-stopped
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
